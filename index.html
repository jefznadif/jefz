<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kosong 😆</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#111;
      font-family:Arial, sans-serif;
    }

    .text{
      color:white;
      font-size:40px;
      font-weight:bold;
      animation: ngakak 1s infinite alternate;
    }

    @keyframes ngakak{
      from{
        transform:scale(1) rotate(-2deg);
      }
      to{
        transform:scale(1.1) rotate(2deg);
      }
    }
  </style>
</head>
<body>

  <div class="text">
    Yahh kosong 😆
  </div>

</body>
</html>
