<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kosong 😆</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#111;
      font-family:Arial, sans-serif;
    }

    .text{
      color:white;
      font-size:40px;
      font-weight:bold;
    }

    .emoji{
      display:inline-block;
      animation: goyang 0.5s infinite alternate;
    }

    @keyframes goyang{
      from{
        transform: rotate(-15deg) scale(1);
      }
      to{
        transform: rotate(15deg) scale(1.2);
      }
    }
  </style>
</head>
<body>

  <div class="text">
    Yahh kosong <span class="emoji">😆</span>
  </div>

</body>
</html>
